[package]
name = "typedpg_lint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "SQL lint rules for typedpg queries, migrations and schema"
keywords = ["postgres", "postgresql", "sql", "linter"]
categories = ["database", "development-tools"]

[features]
# The lint oracle: every finding's fix and claim checked against a real
# PostgreSQL over adversarial rows (see `src/rules/oracle.rs`); run it with
# `scripts/run-lint-oracle.sh`.
pg_sanity = ["typedpg_analyzer/pg_sanity"]

[dependencies]
typedpg_analyzer = { path = "../typedpg_analyzer", version = "0.8.0", features = ["internal"] }
typedpg_core = { path = "../typedpg_core", version = "0.8.0" }
typedpg_pg_query = { path = "../typedpg_pg_query", version = "0.8.0" }
serde = { version = "1", features = ["derive"] }
# The documents keep the key order the report writes (SARIF readers show it), whatever else the build enables.
serde_json = { version = "1", features = ["preserve_order"] }
globset = "0.4"

[dev-dependencies]
# The lint oracle's corpus run (tests/lint_oracle.rs) reuses the analyzer
# fuzzer's query generators, which draw from rand.
rand = "0.10"
