name: npm

# Builds the `typedpg` binary for each platform and assembles the npm
# packages: `@cubos/typedpg` (the runtime, no binary), `@cubos/typedpg-cli`
# (the command and bundler plugins, with an optional dependency on each
# platform's binary) and `@cubos/typedpg-cli-<target>`. The release tag
# (`v0.5.0`, the version of the crates and of the packages) stages them for
# publishing (`npm stage publish`): each goes live once a maintainer approves
# it with 2FA on npmjs.com (Staged Packages) or with `npm stage approve`. A
# manual run only packs them (`npm publish --dry-run`), or stages them too
# with `stage` set.

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      stage:
        description: Stage the packages for publishing, as a release tag does
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: one version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # The loaders' cache key holds the version twice — the binary's (the
      # crates') and the runtime package's — so the two must agree, and the
      # tag must be theirs. The CLI is released in lockstep with the runtime.
      - shell: bash
        run: |
          npm=$(node -p 'require("./typedpg_npm/package.json").version')
          cli=$(node -p 'require("./typedpg_npm_cli/package.json").version')
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [[ "$npm" != "$cargo" ]]; then
            echo "::error::typedpg_npm/package.json is $npm but Cargo.toml is $cargo"
            exit 1
          fi
          if [[ "$cli" != "$npm" ]]; then
            echo "::error::typedpg_npm_cli/package.json is $cli but typedpg_npm/package.json is $npm"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF" != "refs/tags/v$npm" ]]; then
            echo "::error::the tag ${GITHUB_REF#refs/tags/} is not v$npm"
            exit 1
          fi
          echo "version $npm"

  binary:
    name: binary (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64-gnu, os: ubuntu-22.04, rust: x86_64-unknown-linux-gnu }
          - { target: linux-arm64-gnu, os: ubuntu-22.04-arm, rust: aarch64-unknown-linux-gnu }
          - { target: linux-x64-musl, os: ubuntu-24.04, rust: x86_64-unknown-linux-musl, musl: true }
          - { target: linux-arm64-musl, os: ubuntu-24.04-arm, rust: aarch64-unknown-linux-musl, musl: true }
          - { target: darwin-x64, os: macos-15-intel, rust: x86_64-apple-darwin }
          - { target: darwin-arm64, os: macos-15, rust: aarch64-apple-darwin }
          - { target: win32-x64-msvc, os: windows-2025, rust: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # Built on the oldest Ubuntu runner for the glibc targets, so the
      # binary runs on older distributions too; with OpenSSL linked in, so it
      # needs no libssl there (a no-op on macOS and Windows).
      - run: cargo build --release --locked -p typedpg_ts --bin typedpg --features vendored-openssl --target ${{ matrix.rust }}
      - shell: bash
        run: |
          mkdir -p bins/${{ matrix.target }}
          ext=""; [[ "${{ matrix.target }}" == win32-* ]] && ext=".exe"
          cp "target/${{ matrix.rust }}/release/typedpg$ext" "bins/${{ matrix.target }}/"
          "bins/${{ matrix.target }}/typedpg$ext" --version
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: bins

  packages:
    name: assemble and publish
    needs: binary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # `npm test` builds the runtime, which compiles its migration helpers
      # to wasm.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: bins
          merge-multiple: true
      - working-directory: typedpg_npm
        run: |
          npm ci
          npm test
      # The CLI's plugins import the runtime's internal export: build the
      # runtime (above) before it.
      - working-directory: typedpg_npm_cli
        run: |
          npm ci
          npm test
      - working-directory: typedpg_npm
        run: node scripts/assemble.mjs ../bins ../npm-dist
      # Staged publishing needs npm 11.15 (Node 24 may bundle an older one).
      - run: npm install --global npm@^11.15.0 && npm --version
      # The platform packages first: the CLI depends on them (and are worth
      # approving first, for the same reason), then the runtime, then the CLI,
      # which depends on it. `npm stage publish` only stages a package that
      # already exists on the registry: `@cubos/typedpg-cli` is a new name in
      # 0.6.0, so publish a placeholder by hand once before that release
      # (`0.0.0-stage` works; only the first release of a name needs it).
      - shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          STAGE: ${{ inputs.stage }}
        run: |
          publish="npm publish --dry-run"
          if [[ "$GITHUB_REF" == refs/tags/v* || "$STAGE" == true ]]; then
            publish="npm stage publish --access public --provenance"
          fi
          for dir in npm-dist/cli-*; do (cd "$dir" && $publish); done
          (cd npm-dist/typedpg && $publish)
          (cd npm-dist/typedpg-cli && $publish)
