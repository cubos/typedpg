name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  checks:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      # The compile-fail snapshots are taken with one pinned toolchain
      # (TOOLCHAIN in typedpg_compile_fail/tests/compile_fail.rs).
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p typedpg_analyzer --all-targets --features pg_sanity -- -D warnings
      # The runtime's pool backends are optional features: build each set
      # the workspace's feature unification would otherwise hide.
      - run: cargo clippy -p typedpg --all-targets --no-default-features --features bb8 -- -D warnings
      - run: cargo clippy -p typedpg --all-targets --no-default-features -- -D warnings
      # Includes the Docker-backed tests (one PostgreSQL container shared by
      # the whole run, see typedpg_test_support; Docker is available on the
      # hosted runners) and the typedpg_compile_fail snapshots.
      - run: cargo nextest run --release --workspace --no-fail-fast
      # Named again so a snapshot mismatch is its own red step.
      - run: cargo nextest run --release -p typedpg_compile_fail
      - run: cargo test --doc --workspace

  pg-sanity:
    name: pg_sanity oracle (postgres:18)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      # The suite (with the nullability soundness oracle) plus a short pass
      # of the #[ignore]d differential fuzzer, which fails only on
      # high-signal findings: single-fault divergences and unsound
      # nullability.
      - run: scripts/run-pg-sanity.sh --no-fail-fast --run-ignored all
        env:
          FUZZ_ITERS: 300
          FUZZ_STRICT: single

  typescript:
    name: TypeScript (generator, runtime, e2e on postgres:18)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The runtime's unit tests, `typedpg check`, the errors fixture, tsc
      # 7 and 5.9 over the example, then its queries, COPY, streams and
      # migrations on a PostgreSQL container, through node-postgres and
      # postgres.js.
      - run: scripts/run-ts-e2e.sh

  msrv:
    name: minimum Rust version (1.89)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      # Keep in sync with `rust-version` in the workspace Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      # typedpg_ts, the TypeScript CLI (a binary, not published to
      # crates.io), needs a newer Rust for its oxc parser.
      - run: cargo check --workspace --all-targets --exclude typedpg_ts

  old-glibc:
    name: build on glibc 2.36 (Debian bookworm)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The sql! proc macro links the bundled C parser: building something
    # that expands it proves the macro loads where libc lacks symbols newer
    # glibc versions have (strlcpy arrived in 2.38).
    container: rust:bookworm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p typedpg_example

  package:
    name: publish dry run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Packages and builds every published crate on its own, as crates.io
      # would: catches a crate that only compiles thanks to the workspace's
      # feature unification.
      - run: cargo publish --workspace --dry-run
