[package]
name = "typedpg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Typed PostgreSQL access with compile-time verification"
keywords = ["postgres", "postgresql", "sql", "async", "type-safe"]
categories = ["database"]
readme = "README.md"

[features]
default = ["deadpool"]
deadpool = ["dep:deadpool-postgres"]
bb8 = ["dep:bb8", "dep:bb8-postgres"]

[dependencies]
typedpg_core = { path = "../typedpg_core", version = "0.4.0" }
typedpg_macros = { path = "../typedpg_macros", version = "0.4.0" }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4", "with-uuid-1", "with-cidr-0_3", "with-eui48-1"] }
rust_decimal = { version = "1", features = ["db-tokio-postgres"] }
deadpool-postgres = { version = "0.14", optional = true }
bb8 = { version = "0.9", optional = true }
bb8-postgres = { version = "0.9", optional = true }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde"] }
md5 = "0.8"
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
typedpg_test_support = { path = "../typedpg_test_support" }
