# The crate `typedpg_cli`'s lint integration test reads. It is its own
# workspace (and excluded from the main one): nothing builds it, the test
# only runs `cargo typedpg lint` over its sources and migrations.
[package]
name = "lint_fixture"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[package.metadata.typedpg.database]
migrations = "./migrations"

[package.metadata.typedpg.lint]
ignore = ["tests/ignored.rs"]
# Pins the original rules' rendering; the new rules have their own unit tests.
redundant_null_check = "off"
limit_without_order = "off"
redundant_limit = "off"
redundant_distinct = "off"
fk_type_mismatch = "off"
missing_lock_timeout = "off"
fetch_may_return_many = "off"
fetch_all_single_row = "off"
unused_returning = "off"

[package.metadata.typedpg.databases.other.database]
migrations = "./other_migrations"
