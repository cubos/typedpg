[package]
name = "typedpg_macros"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Proc macros for typedpg"
keywords = ["postgres", "sql", "macro", "type-safe"]
categories = ["database", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
typedpg_core = { path = "../typedpg_core", version = "0.2.0" }
typedpg_analyzer = { path = "../typedpg_analyzer", version = "0.2.0" }
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full", "extra-traits"] }
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
