[package]
name = "typedpg_pg_query"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Our code is MIT; the bundled PostgreSQL sources are under the PostgreSQL
# License, and csrc/plpgsql (libpg_query's PL/pgSQL compiler driver) under
# BSD-3-Clause.
license = "MIT AND PostgreSQL AND BSD-3-Clause"
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "PostgreSQL parser bindings for typedpg, built on PostgreSQL's own sources"
keywords = ["postgres", "postgresql", "sql", "parser"]
categories = ["database", "parser-implementations"]
links = "typedpg_postgres"
build = "build.rs"
# Only what the build compiles (the import tooling and the tarball cache stay
# out).
include = [
    "/Cargo.toml",
    "/build.rs",
    "/POSTGRES_VERSION",
    "/POSTGRES_SHA256",
    "/import/FILES",
    "/csrc/**/*",
    "/postgres/**/*",
    "/README.md",
    "/src/**/*.rs",
    "/tests/**/*.rs",
]

[dependencies]
# A tree's depth is bounded by the converter (10,000 message levels, as
# libpg_query's protobuf encoder was): the stack for deeper ones is
# src/stack.rs's.
serde = { version = "1", features = ["derive"] }
stacker = "0.1"
serde_json = "1"
thiserror = "2"

[build-dependencies]
cc = "1"

[dev-dependencies]
typedpg_core = { path = "../typedpg_core" }
