[workspace]
resolver = "3"
members = [
    "typedpg",
    "typedpg_core",
    "typedpg_macros",
    "typedpg_analyzer",
    "typedpg_cli",
    "typedpg_example",
    "typedpg_e2e",
    "typedpg_seed",
    "typedpg_pg_query",
    "typedpg_pg_query_codegen",
    "typedpg_compile_fail",
    "typedpg_test_support",
    "typedpg_ts",
    "typedpg_wasm",
]

# The npm runtime's copy of the migration helpers, compiled to WebAssembly:
# small and self-contained (it must fit in a JS string).
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Shared metadata inherited by the publishable crates via `<field>.workspace = true`.
[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cubos/typedpg"
homepage = "https://github.com/cubos/typedpg"
authors = ["Cubos"]
