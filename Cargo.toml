[workspace]
resolver = "3"
members = [
    "typedpg",
    "typedpg_core",
    "typedpg_macros",
    "typedpg_analyzer",
    "typedpg_cli",
    "typedpg_example",
    "typedpg_e2e",
    "typedpg_seed",
    "typedpg_pg_query",
    "typedpg_pg_query_codegen",
]

# Shared metadata inherited by the publishable crates via `<field>.workspace = true`.
[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cubos/typedpg"
homepage = "https://github.com/cubos/typedpg"
authors = ["Cubos"]
