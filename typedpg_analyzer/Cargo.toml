[package]
name = "typedpg_analyzer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Static SQL type and nullability analyzer for typedpg"
keywords = ["postgres", "postgresql", "sql", "static-analysis", "types"]
categories = ["database"]
# The extension scripts are embedded from their zstd compressions
# (`<file>.sql.zst`); the readable `.sql` files stay in the repository.
exclude = ["src/extensions/*.sql"]

[features]
internal = []
# Cross-check every `apply_sql` / `analyze` call against a real PostgreSQL
# server. Each `PgCatalog` creates its own scratch database inside the
# shared cluster pointed to by `POSTGRES_URL` and tears it down on Drop.
# Spin up the cluster + run tests via `scripts/run-pg-sanity.sh`.
pg_sanity = ["catalog_export", "dep:bytes"]
# Read a live server's system catalogs into the catalog rows (`typedpg_seed`,
# the `pg_sanity` catalog oracle).
catalog_export = ["dep:postgres"]
# Record every query `analyze` accepts, with the migrations its catalog
# applied before it, to `$TYPEDPG_RECORD_CORPUS/` (JSON lines): the lint
# oracle replays the analyzer's test suite as its corpus
# (`scripts/run-lint-oracle.sh`).
record_corpus = []

[dependencies]
typedpg_core = { path = "../typedpg_core", version = "0.8.0" }
typedpg_pg_query = { path = "../typedpg_pg_query", version = "0.8.0" }
stacker = "0.1"
base64 = "0.23"
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_tuple = "1"
thiserror = "2"
postgres = { version = "0.19", optional = true }
bytes = { version = "1", optional = true }
# Decompresses the bundled extension scripts (`src/extensions/*.sql.zst`):
# pure Rust, so no C library is linked into the targets the analyzer runs on.
ruzstd = { version = "0.9", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
typedpg_analyzer = { path = ".", features = ["internal"] }
# Used by the differential fuzzer (tests/fuzz.rs, only active under the
# `pg_sanity` feature): rand for seeded query generation.
rand = "0.10"
